services:
  db:
      image: postgres:16
      container_name: toscrape_db
      ports:
        - "5432:5432"
      environment:
        POSTGRES_DB: toscrape
        POSTGRES_USER: toscrape
        POSTGRES_PASSWORD: toscrape
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U toscrape -d toscrape"]
        interval: 5s
        timeout: 5s
        retries: 5

  scraper:
      build: .
      container_name: toscrape_scraper
      working_dir: /app
      depends_on:
        db:
          condition: service_healthy
      environment:
        - PYTHONPATH=/app
        - POSTGRES_HOST=db
        - PYTHONUNBUFFERED=1
      command: python -u main.py
      volumes:
        - .:/app

volumes:
  pgdata:





services:
  db:
    image: postgres:16
    container_name: toscrape_db
    environment:
      POSTGRES_DB: toscrape
      POSTGRES_USER: toscrape
      POSTGRES_PASSWORD: toscrape
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  scraper:
    build: .
    container_name: toscrape_scraper
    depends_on:
      - db
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://toscrape:toscrape@db:5432/toscrape
      - POSTGRES_USER=toscrape
      - POSTGRES_PASSWORD=toscrape
      - POSTGRES_DB=toscrape
      - POSTGRES_HOST=db
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app

volumes:
  pgdata:




